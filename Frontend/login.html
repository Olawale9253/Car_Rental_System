<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarRentalPro - Login</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="auth">
    <div class="auth-container">
        <!-- Left Side - Form -->
        <div class="auth-form-wrapper">
            <div class="auth-form">
                <!-- Logo -->
                <div class="auth-logo">
                    <i class="fas fa-car-side"></i>
                    <span>CarRental<span class="highlight">Pro</span></span>
                </div>
                
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to manage your car rental fleet</p>
                
                <!-- Social Login -->
                <div class="social-login">
                    <button class="social-btn google">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn email">
                        <i class="fas fa-envelope"></i>
                        <span>Email</span>
                    </button>
                </div>
                
                <div class="divider">
                    <span>or continue with</span>
                </div>
                
                <!-- Login Form -->
                <form id="loginForm" onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" placeholder="admin@carrentalpro.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" checked>
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="auth-btn-primary">Sign In</button>
                </form>
                
                <p class="auth-footer">
                    Don't have an account? <a href="signup.html">Create account</a>
                </p>
            </div>
        </div>
        
        <!-- Right Side - Background / Hero -->
        <div class="auth-hero">
            <div class="auth-hero-overlay">
                <div class="auth-hero-content">
                    <h1>Drive Your Business Forward</h1>
                    <p>Complete fleet management solution for modern car rental agencies</p>
                    
                    <div class="auth-features">
                        <div class="auth-feature">
                            <i class="fas fa-car"></i>
                            <span>Fleet Management</span>
                        </div>
                        <div class="auth-feature">
                            <i class="fas fa-file-contract"></i>
                            <span>Rental Tracking</span>
                        </div>
                        <div class="auth-feature">
                            <i class="fas fa-chart-line"></i>
                            <span>Analytics & Reports</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
